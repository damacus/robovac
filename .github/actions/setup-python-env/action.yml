name: 'Setup Python Environment'
description: 'Checks out code, sets up Python, Task, uv, and installs dev dependencies'

inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: '3.14'
  dev-dependencies:
    description: 'Install dev dependencies'
    required: false
    default: 'false'
  dependencies:
    description: 'Install dependencies'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Taskfile
      uses: arduino/setup-task@v3.0.0
      with:
        version: 3.x
        repo-token: ${{ github.token }} # Use github.token in composite actions

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install Python dependencies
      shell: bash
      run: task install-dev
      if: ${{ inputs.dev-dependencies == 'true' }}

    - name: Install Python dependencies
      shell: bash
      run: task install
      if: ${{ inputs.dependencies == 'true' }}
